name: Task
description: Create a task issue aligned with ZEM protocol and file-based tracking.
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## Description
        Provide a concise description of the task.
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the goal and context...
    validations:
      required: true
  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: verification-plan
    attributes:
      label: Verification Plan
      placeholder: |
        1. Step 1
        2. Step 2
    validations:
      required: true
